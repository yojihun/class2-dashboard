<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2반 관리 시스템</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="management-screen">
    <header class="hero">
      <nav class="topbar">
        <a href="index.html">대시보드</a>
      </nav>
      <div class="hero-grid">
        <section class="hero-copy">
          <p class="eyebrow">관리 시스템</p>
          <h1>주간 업무 관리</h1>
          <p class="hero-text">주간 업무 PDF를 업로드하고 2반 일정에 반영할 항목을 체크하세요.</p>
        </section>
      </div>
    </header>

    <main>
      <section class="content-band">
        <article class="panel">
          <div class="manager-head">
            <input id="weekly-pdf-input" type="file" accept="application/pdf">
            <select id="plan-select" aria-label="주간 계획 선택"></select>
          </div>
          <div class="manager-actions">
            <button id="save-plan-btn" type="button">저장(대시보드 반영)</button>
            <span id="published-plan-label">현재 반영: 없음</span>
          </div>
          <p class="manager-help">파싱 우선순위: `/api/parse-weekly-pdf` Gemini API -> 로컬 파서 순서로 동작합니다.</p>
          <div id="plan-status" class="plan-status">아직 업로드된 주간 업무가 없습니다.</div>
          <div id="plan-tasks" class="plan-tasks"></div>
        </article>
      </section>
    </main>

    <footer>
      <span>여기서 변경한 내용은 로컬 저장소를 통해 대시보드에 즉시 반영됩니다.</span>
      <a href="index.html">대시보드로 이동</a>
    </footer>
    <script type="module" src="management.js"></script>
  </body>
</html>
