<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2반 관리 시스템</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="management-screen manager-locked">
    <section class="manager-login" aria-label="관리 비밀번호">
      <form id="manager-login-form" class="panel manager-login-panel">
        <p class="section-kicker">Management</p>
        <h1>관리 모드</h1>
        <label>비밀번호<input id="manager-password-input" type="password" inputmode="numeric" autocomplete="current-password" autofocus></label>
        <div class="manager-actions compact-actions">
          <button type="submit">열기</button>
          <span id="manager-login-status">비밀번호를 입력하세요.</span>
        </div>
      </form>
    </section>
    <header class="hero management-hero">
      <nav class="topbar">
        <a href="index.html">대시보드</a>
      </nav>
      <div class="hero-grid">
        <section class="hero-copy">
          <p class="eyebrow">관리 시스템</p>
          <h1>대시보드 관리</h1>
          <p class="hero-text">TV와 모바일 대시보드에 보이는 메시지, 링크, 역할, 자리배치, 주간 일정을 한 곳에서 정리합니다.</p>
        </section>
      </div>
    </header>

    <main class="manager-main">
      <section class="manager-layout">
        <article class="panel manager-panel">
          <div class="section-title"><div><p class="section-kicker">Dashboard</p><h2>대시보드 설정</h2></div></div>
          <div class="settings-grid">
            <label>담임 이름<input id="teacher-name-input" type="text"></label>
            <label>담당 교과<input id="teacher-subject-input" type="text"></label>
            <label>교무실<input id="teacher-office-input" type="text"></label>
            <label>연락처<input id="teacher-phone-input" type="text"></label>
            <label>Instagram 표시<input id="teacher-instagram-input" type="text"></label>
            <label>Instagram 링크<input id="teacher-instagram-url-input" type="url"></label>
            <label class="span-2">담임샘 메시지 제목<input id="message-title-input" type="text"></label>
            <label class="span-2">담임샘 메시지<textarea id="message-body-input" rows="3"></textarea></label>
            <label class="span-2">오늘의 한마디<input id="quote-input" type="text"></label>
            <label class="span-2">모바일 링크 <small>한 줄에 하나씩: 이름 | URL</small><textarea id="quick-links-input" rows="4"></textarea></label>
            <label class="span-2">1인1역할 <small>한 줄에 하나씩: 역할 | 학생이름</small><textarea id="roles-input" rows="8"></textarea></label>
            <label class="span-2">자리배치 <small>한 줄이 한 줄 좌석입니다. 이름은 쉼표로 구분</small><textarea id="seating-input" rows="5"></textarea></label>
          </div>
          <div class="manager-actions compact-actions">
            <button id="save-settings-btn" type="button">대시보드 설정 저장</button>
            <span id="settings-status">설정을 불러오는 중입니다...</span>
          </div>
        </article>

        <article class="panel manager-panel">
          <div class="section-title"><div><p class="section-kicker">Weekly PDF</p><h2>주간 일정</h2></div></div>
          <div class="manager-head slim">
            <input id="weekly-pdf-input" type="file" accept="application/pdf">
            <select id="plan-select" aria-label="주간 계획 선택"></select>
          </div>
          <div class="manager-actions compact-actions">
            <button id="save-plan-btn" type="button">선택 일정 반영</button>
            <span id="published-plan-label">현재 반영: 없음</span>
          </div>
          <div id="plan-status" class="plan-status">아직 업로드된 주간 업무가 없습니다.</div>
          <div id="plan-tasks" class="plan-tasks compact-plan-tasks"></div>
        </article>

        <article class="panel manager-panel manager-panel-full">
          <div class="section-title"><div><p class="section-kicker">Homework / Tasks</p><h2>할일 (To-Do)</h2></div></div>
          <div class="settings-grid todo-form-grid">
            <label>마감 날짜<input id="todo-date-input" type="date"></label>
            <label>교시<select id="todo-period-input">
              <option value="">교시 없음</option>
              <option value="1">1교시</option>
              <option value="2">2교시</option>
              <option value="3">3교시</option>
              <option value="4">4교시</option>
              <option value="5">5교시</option>
              <option value="6">6교시</option>
              <option value="7">7교시</option>
            </select></label>
            <label>과목명<input id="todo-subject-input" type="text" placeholder="예: 수학"></label>
            <label>할일 내용 / 과제명<input id="todo-task-input" type="text" placeholder="예: p.35 문제 1-5번 풀기"></label>
          </div>
          <div class="manager-actions compact-actions">
            <button id="add-todo-btn" type="button">할일 추가</button>
            <span id="todo-status"></span>
          </div>
          <div id="todo-list" class="todo-list"></div>
        </article>
      </section>
    </main>

    <footer>
      <span>저장한 내용은 Firestore를 통해 대시보드에 반영됩니다.</span>
      <a href="index.html">대시보드로 이동</a>
    </footer>
    <script type="module" src="management.js"></script>
  </body>
</html>
